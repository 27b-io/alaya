# Ephemeral benchmark stack: Alaya + backends, no persistent state.
#
# Build the local image first:
#   docker build -t localhost/alaya:bench .
#
# Usage:
#   EMBEDDING_URL=http://<your-tei-host> docker compose up -d
#   uv run longmemeval_bench.py --limit 20
#   docker compose down -v

services:
  qdrant:
    image: docker.io/qdrant/qdrant:v1.14.1
    environment:
      QDRANT__STORAGE__STORAGE_PATH: /tmp/qdrant_bench
    ports: ["127.0.0.1:16333:6333"]  # loopback-only (alaya runs auth-disabled); off default 6333 so the harness's data-safety guard can fail closed
    tmpfs: ["/tmp/qdrant_bench"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  falkordb:
    image: docker.io/falkordb/falkordb:v4.18.2
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h localhost -p 6379 PING || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  bridge:
    image: localhost/alaya:bench
    command: alaya-bridge
    environment:
      REDIS_URL: redis://falkordb:6379
      GRAPH_NAME: bench_memory
      RUST_LOG: warn
    ports: ["127.0.0.1:18080:8080"]
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  alaya:
    image: localhost/alaya:bench
    command: alaya-server
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: bench_memories
      EMBEDDING_URL: ${EMBEDDING_URL:?Set EMBEDDING_URL to a reachable TEI endpoint}
      EMBEDDING_MODEL: Snowflake/snowflake-arctic-embed-l-v2.0
      EMBEDDING_DIMENSIONS: "1024"
      # Texts per embed request. Default 32 = TEI's default cap. Set
      # EMBEDDING_BATCH_SIZE=256 when EMBEDDING_URL points at a TEI with
      # max-client-batch-size=256 (e.g. the fnord-wsl GPU box). Clamped to 256.
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      GRAPH_URL: http://bridge:8080
      LISTEN_ADDR: 0.0.0.0:3001
      # alaya_core=debug surfaces the per-search "cross-encoder rerank reordered"
      # line (Signal 2) so the A/B can PROVE rerank fired, not just assume it.
      # That line is logged at debug in alaya-core — info would not emit it.
      RUST_LOG: alaya_server=info,alaya_core=debug
      # Rerank ON by default (points at tei-rerank). For the rerank-OFF arm:
      #   RERANK_URL= docker compose up -d alaya
      RERANK_URL: ${RERANK_URL-http://tei-rerank:80}
      RERANK_TOP_N: "20"
      # Server is fail-closed (panics with no auth). This is an ephemeral,
      # localhost-only bench, so opt into the dev-open mode AND give it a
      # private origin (the open mode is refused on a public PUBLIC_BASE_URL).
      DANGEROUSLY_ALLOW_UNAUTHENTICATED: "true"
      PUBLIC_BASE_URL: http://localhost:3001
    ports: ["127.0.0.1:3001:3001"]  # loopback-only: server runs DANGEROUSLY_ALLOW_UNAUTHENTICATED
    depends_on:
      qdrant:
        condition: service_healthy
      bridge:
        condition: service_healthy
      tei-rerank:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Cross-encoder reranker for the rerank A/B. ~1GB model download on first run.
  # Defaults to the x86 CPU tag — this bench runs on the x86 lab box (Ryzen/GTX).
  # Mac/arm dev: TEI_TAG=cpu-arm64-latest. GPU: swap to a cuda image + nvidia runtime.
  tei-rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:${TEI_TAG:-cpu-1.9.3}
    command: --model-id ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3} --port 80
    volumes:
      - tei_rerank_cache:/data
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

volumes:
  tei_rerank_cache:  # model cache only — bench DATA stays ephemeral (tmpfs)
