repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # k8s manifests (deploy/) are multi-document files.
        args: ['--allow-multiple-documents']
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
        # testkit.rs holds two intentional test-only OIDC keypairs. This hook has
        # no content allowlist, so the file is excluded here — but gitleaks (below)
        # still scans it and flags any NON-allowlisted secret via .gitleaks.toml.
        exclude: ^crates/alaya-server/src/testkit\.rs$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # No file exclude: gitleaks scans testkit.rs and allowlists ONLY the two
      # known test keypairs by regex (.gitleaks.toml), so a new secret added to
      # that file is still caught.
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace
        language: system
        types: [rust]
        pass_filenames: false

      - id: wasm-check
        name: wasm build check
        entry: bash -c 'cargo build -p alaya-types --target wasm32-unknown-unknown && cargo build -p alaya-backends --target wasm32-unknown-unknown && cargo build -p alaya-core --target wasm32-unknown-unknown'
        language: system
        types: [rust]
        pass_filenames: false
