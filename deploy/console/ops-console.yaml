# Deploy template for ops-console: Deployment + Service. The deployed manifest
# lives in the private infra repo and is the truth; this copy documents the
# runtime contract (image, command, env, probes, security context) so the
# crate README has something concrete to point at. Deliberately NOT here:
# the NetworkPolicy / egress allowlist, real hostnames, the image digest pin
# and the flux imagepolicy marker — cluster topology is not published from
# this repository.
#
# Binding shape for any deployment of this binary:
#   - own Deployment + own label (app: ops-console) — never colocated behind
#     `app: alaya-server`
#   - own NetworkPolicy with egress pinned to the module upstreams (Ālaya API;
#     anthropic-lb + a Prometheus-compatible query route for the LB pane) and
#     the OIDC IdP (external :443) only; NO egress to any shared datastore.
#     Defined alongside the deployed manifest, verified from the live pod.
#   - single replica BY DESIGN: logout revocation is in-memory
#   - Reloader annotation — editing the ops-console-env Secret rolls the pod
#   - plain env for the non-secret settings; the six credentials come from
#     the Secret; the console is fail-closed (see envFrom note below)
#   - TLS terminates at the edge in front of this Service:3002, not in the pod
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-console
  namespace: mcp
  labels:
    app: ops-console
  annotations:
    secret.reloader.stakater.com/reload: "ops-console-env"
spec:
  # Single replica BY DESIGN: logout revocation is in-memory.
  replicas: 1
  selector:
    matchLabels:
      app: ops-console
  template:
    metadata:
      labels:
        app: ops-console
    spec:
      # Never talks to the k8s API; a tailnet-reachable admin pod gets no token.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ops-console
          image: ghcr.io/27b-io/alaya:main # deployed: :main@sha256:<digest> + imagepolicy marker
          command: ["ops-console"]
          ports:
            - containerPort: 3002
              name: http
          env:
            # Plain http BY DESIGN: alaya-server terminates no TLS (bare
            # TcpListener; TLS is at the edge). Pod-to-pod on the namespace
            # CNI is the trust boundary, the same one every other in-cluster
            # alaya consumer uses for :3001. The NetworkPolicy pins this
            # traffic to alaya-server pods only.
            - name: ALAYA_URL
              value: "http://alaya-server.mcp.svc:3001"
            # anthropic-lb read-only pane. Plain http, pod-to-pod — the same
            # trust boundary as ALAYA_URL (a keyed URL that is plain http
            # off-cluster refuses startup). LB_URL, METRICS_URL (here) and
            # LB_API_KEY (Secret) are ONE all-or-nothing group: land all three
            # in the same change. None set → Ālaya-only; a half-set group
            # refuses startup by design.
            - name: LB_URL
              value: "http://anthropic-lb.mcp.svc:8082"
            # Prometheus-compatible query API for the 7-day budget-burn
            # history off anthropic_cluster_budget_used — the LB's own
            # fleet-wide gauge. The console only calls /api/v1/query_range
            # here; deploy it behind a route that exposes nothing else.
            - name: METRICS_URL
              value: "http://<query-route>:8427" # deployed: a path-scoped proxy in front of the metrics store
            # OIDC relying party. redirect_uri is derived as
            # {CONSOLE_PUBLIC_URL}/auth/callback and must match the client
            # registration on the IdP exactly.
            - name: CONSOLE_PUBLIC_URL
              value: "https://ops.<tailnet>.ts.net"
            - name: CONSOLE_OIDC_ISSUER
              value: "https://id.27b.io"
            - name: RUST_LOG
              value: "ops_console=info,tower_http=info"
          # Credentials come from the Secret (secret manager → ESO):
          #   CONSOLE_OIDC_CLIENT_ID, CONSOLE_OIDC_CLIENT_SECRET,
          #   CONSOLE_ALLOWED_SUBJECTS, CONSOLE_SESSION_SECRET, ALAYA_API_KEY,
          #   LB_API_KEY (anthropic-lb operator key, sent as x-api-key)
          # The console is fail-closed: it refuses to start if any of the first
          # five is missing, or if the LB_* group is only partially set.
          envFrom:
            - secretRef:
                name: ops-console-env
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3002
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: ops-console
  namespace: mcp
  labels:
    app: ops-console
spec:
  selector:
    app: ops-console
  ports:
    - port: 3002
      targetPort: 3002
      name: http
