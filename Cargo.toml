[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/27b-io/alaya"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.11"

# WASM-compat deps (backends + core)
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
uuid = { version = "1", features = ["v5"] }
regex = "1"
futures = "0.3"

# Bridge-only deps
tokio = { version = "1", features = ["full"] }
axum = "0.8"
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mini-moka = "0.10"
cachekit-rs = { version = "0.7", default-features = false, features = ["redis", "cachekitio", "l1", "unsync"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
