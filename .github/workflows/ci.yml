name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: 27b-io/alaya
  CARGO_TERM_COLOR: always

# All jobs run GitHub-hosted: public, forkable repo.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup target add wasm32-unknown-unknown --toolchain stable
          rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - name: WASM gate
        run: |
          cargo build -p alaya-types --target wasm32-unknown-unknown
          cargo build -p alaya-backends --target wasm32-unknown-unknown
          cargo build -p alaya-core --target wasm32-unknown-unknown

  # Compare-and-set against a real Qdrant: the two-process races in
  # qdrant_cas_real are #[ignore]d without a server, so they only count here.
  qdrant-races:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.17.1@sha256:94728574965d17c6485dd361aa3c0818b325b9016dac5ea6afec7b4b2700865f
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Wait for Qdrant
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:6333/ && exit 0
            sleep 2
          done
          echo "Qdrant did not come up" >&2
          exit 1
      - name: Two-process write races
        env:
          QDRANT_TEST_URL: http://localhost:6333
        run: cargo test -p alaya-backends --test qdrant_cas_real -- --include-ignored --test-threads=1

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies for RUSTSEC advisories
        run: cargo audit

  # Pushes only the immutable sha-<short> tag. The moving main/latest tags are
  # left to promote-image, so they follow commit order, not build-finish order.
  build-image:
    needs: [check, audit, qdrant-races]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha

      # Build identity for GET /health/detail + MCP serverInfo (#70). Stamped here
      # rather than in the Dockerfile so the value is deterministic per run
      # and a cached build layer can't carry a stale timestamp forward.
      - name: Stamp build timestamp
        id: stamp
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.stamp.outputs.built_at }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # Moves main/latest to this run's build only while its commit is still the
  # head of main. One promotion at a time, so a check and its retag never
  # interleave with another run's. queue: max keeps every waiting run: the
  # default keeps one and cancels the rest, which could drop the newest commit's.
  promote-image:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: promote-image-main
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check this commit is still the head of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: .github/scripts/is-branch-head.sh

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
        if: steps.head.outputs.current == 'true'

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        if: steps.head.outputs.current == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A single-index source is copied as-is, so main/latest carry the same
      # digest as this run's sha-<short> tag.
      - name: Move main and latest to this build
        if: steps.head.outputs.current == 'true'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ needs.build-image.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:main" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}@${DIGEST:?build-image produced no digest}"
