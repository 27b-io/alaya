[package]
name = "ops-console"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ops-console"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls"] }
sha2 = { workspace = true }

# SSR-only Leptos: views render to HTML strings inside axum handlers.
# No hydration/WASM — the console is plain forms + links (AC9: POST + CSRF).
leptos = { version = "0.8", features = ["ssr"] }

# Encrypted (private) cookie jar for sessions — AES-GCM via the cookie crate.
# `form` adds multi-value form support (serde_html_form) for checkbox groups.
axum-extra = { version = "0.10", features = ["cookie-private", "form"] }

# ID-token verification for the OIDC RP flow. Same version + crypto backend
# as alaya-server (aws_lc_rs keeps RUSTSEC-2023-0071 `rsa` out of the tree).
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }

base64 = "0.22"
rand = "0.9"
url = "2"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Mint encrypted session cookies in tests (same crate/version axum-extra uses).
cookie = { version = "0.18", features = ["private"] }
