[package]
name = "alaya-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "alaya-server"
path = "src/main.rs"

[dependencies]
alaya-types = { path = "../alaya-types" }
alaya-backends = { path = "../alaya-backends" }
alaya-core = { path = "../alaya-core" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "rustls-tls"] }
mini-moka = { workspace = true }
cachekit-rs = { workspace = true }
futures = { workspace = true }

# Auth (native-only — must never reach WASM-targeted crates)
# v10 made the crypto backend pluggable; pick pure-Rust to keep C toolchains
# (aws-lc-sys/cmake) out of the container build, matching the rustls-tls stance.
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
subtle = "2"

# OpenTelemetry (optional — enabled when OTEL_ENDPOINT is set)
opentelemetry = "0.29"
opentelemetry_sdk = { version = "0.29", features = ["rt-tokio-current-thread"] }
opentelemetry-otlp = { version = "0.29", default-features = false, features = ["http-proto", "reqwest-client", "trace"] }
tracing-opentelemetry = "0.30"
