[package]
name = "alaya-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "alaya-server"
path = "src/main.rs"

[dependencies]
alaya-types = { path = "../alaya-types" }
alaya-backends = { path = "../alaya-backends" }
alaya-core = { path = "../alaya-core" }
alaya-oidc = { path = "../alaya-oidc" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "rustls-tls"] }
mini-moka = { workspace = true }
cachekit-rs = { workspace = true }
futures = { workspace = true }

subtle = { workspace = true }

# OpenTelemetry (optional — enabled when OTEL_ENDPOINT is set)
opentelemetry = "0.29"
opentelemetry_sdk = { version = "0.29", features = ["rt-tokio-current-thread"] }
opentelemetry-otlp = { version = "0.29", default-features = false, features = ["http-proto", "reqwest-client", "trace"] }
tracing-opentelemetry = "0.30"

[dev-dependencies]
# Pre-seed the JWKS cache so `oidc`, `auth` and `wellknown` tests verify real
# signed tokens without a network. Dev-only by construction.
alaya-oidc = { path = "../alaya-oidc", features = ["test-seams"] }
# Token minting for testkit — verification itself lives in alaya-oidc.
jsonwebtoken = { workspace = true }
# test-util enables tokio's paused clock (start_paused) for the wedge
# regression tests (#63) — deliberately dev-only.
tokio = { workspace = true, features = ["test-util"] }
# ServiceExt::oneshot drives composed Routers in-process: the health auth-split
# tests (#77) and the read-only bearer middleware tests (#80) exercise the real
# layering rather than a replica. Already in the lock via axum — pulls nothing new.
tower = { version = "0.5", features = ["util"] }
