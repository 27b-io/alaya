[package]
name = "alaya-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "alaya-server"
path = "src/main.rs"

[dependencies]
alaya-types = { path = "../alaya-types" }
alaya-backends = { path = "../alaya-backends" }
alaya-core = { path = "../alaya-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "rustls-tls"] }
mini-moka = { workspace = true }
cachekit-rs = { workspace = true }
futures = { workspace = true }

# Auth (native-only — must never reach WASM-targeted crates)
# v10 made the crypto backend pluggable. aws_lc_rs (BoringSSL-derived, C)
# instead of rust_crypto: keeps the vulnerable pure-Rust `rsa` crate
# (RUSTSEC-2023-0071) out of the tree. Requires cmake in the build image.
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
subtle = "2"

# OpenTelemetry (optional — enabled when OTEL_ENDPOINT is set)
opentelemetry = "0.29"
opentelemetry_sdk = { version = "0.29", features = ["rt-tokio-current-thread"] }
opentelemetry-otlp = { version = "0.29", default-features = false, features = ["http-proto", "reqwest-client", "trace"] }
tracing-opentelemetry = "0.30"

[dev-dependencies]
# test-util enables tokio's paused clock (start_paused) for the wedge
# regression tests (#63) — deliberately dev-only.
tokio = { workspace = true, features = ["test-util"] }
# oneshot() for route-level middleware tests (already in-tree via axum).
tower = { version = "0.5", features = ["util"] }
