# Alaya local dev stack.
#
# First run pulls ~2GB (TEI model + Qdrant + FalkorDB + Rust build).
# Subsequent runs use cached layers and named volumes.
#
#   docker compose up --build -d
#   docker compose logs -f          # watch startup (TEI is slowest)
#   docker compose ps               # verify all healthy
#   docker compose down              # stop, keep data
#   docker compose down -v           # stop + wipe volumes

services:

  # ── External backends ────────────────────────────────────────────

  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 5

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    command: --model-id ${TEI_MODEL:-Snowflake/snowflake-arctic-embed-l-v2.0} --port 80
    ports:
      - "8888:80"
    volumes:
      - tei_cache:/data
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:80/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  # ── Alaya services ───────────────────────────────────────────────

  alaya-bridge:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    entrypoint: ["/usr/local/bin/alaya-bridge"]
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: redis://falkordb:6379
      GRAPH_NAME: ${GRAPH_NAME:-memory_graph}
      GRAPH_API_KEY: ${GRAPH_API_KEY:-}
      RUST_LOG: ${RUST_LOG_BRIDGE:-alaya_bridge=info}
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  alaya-server:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    entrypoint: ["/usr/local/bin/alaya-server"]
    ports:
      - "3001:3001"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-memories_arctic1024}
      EMBEDDING_URL: http://tei:80
      EMBEDDING_MODEL: ${TEI_MODEL:-Snowflake/snowflake-arctic-embed-l-v2.0}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      GRAPH_URL: http://alaya-bridge:8080
      GRAPH_API_KEY: ${GRAPH_API_KEY:-}
      ALAYA_API_KEY: ${ALAYA_API_KEY:-}
      LISTEN_ADDR: 0.0.0.0:3001
      REDIS_CACHE_URL: redis://falkordb:6379
      RUST_LOG: ${RUST_LOG_SERVER:-alaya_server=info}
      # Uncomment for auto-summary (requires Anthropic API key):
      # SUMMARY_URL: https://api.anthropic.com/v1/messages
      # SUMMARY_API_KEY: ${SUMMARY_API_KEY:-}
      # SUMMARY_MODEL: ${SUMMARY_MODEL:-claude-haiku-4-5-20251001}
    depends_on:
      alaya-bridge:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      tei:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  falkordb_data:
  qdrant_data:
  tei_cache:
