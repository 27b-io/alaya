# A reqwest client reads HTTP_PROXY / HTTPS_PROXY / ALL_PROXY at build() unless
# told not to, which would route a request (and its credential) to the proxy
# instead of the host the boot guards classified. Each client this workspace
# builds is built at a sanctioned site that calls `.no_proxy()` and carries a
# scoped `#[allow(clippy::disallowed_methods)]`. Clients a dependency builds
# internally are outside this lint.
#
# The lint cannot see whether `.no_proxy()` is there; the proxy tests do:
# `clients_ignore_system_proxy` in alaya-server and
# `http::tests::client_ignores_system_proxy` in ops-console. A new sanctioned
# site needs a probe in one of them. CI runs clippy without --all-targets, so
# test-only clients are not affected.
disallowed-methods = [
    { path = "reqwest::Client::builder", reason = "reads HTTP_PROXY at build(): call .no_proxy(), #[allow] the site, and add a probe to the proxy test (see clippy.toml)" },
    { path = "reqwest::Client::new", reason = "reads HTTP_PROXY at build(): call .no_proxy(), #[allow] the site, and add a probe to the proxy test (see clippy.toml)" },
    { path = "reqwest::ClientBuilder::new", reason = "reads HTTP_PROXY at build(): call .no_proxy(), #[allow] the site, and add a probe to the proxy test (see clippy.toml)" },
    { path = "reqwest::blocking::Client::builder", reason = "reads HTTP_PROXY at build(): call .no_proxy(), #[allow] the site, and add a probe to the proxy test (see clippy.toml)" },
    { path = "reqwest::blocking::Client::new", reason = "reads HTTP_PROXY at build(): call .no_proxy(), #[allow] the site, and add a probe to the proxy test (see clippy.toml)" },
    { path = "reqwest::blocking::ClientBuilder::new", reason = "reads HTTP_PROXY at build(): call .no_proxy(), #[allow] the site, and add a probe to the proxy test (see clippy.toml)" },
    { path = "reqwest::get", reason = "builds a default client that reads HTTP_PROXY: use a sanctioned client that sets .no_proxy() (see clippy.toml)" },
    { path = "reqwest::blocking::get", reason = "builds a default client that reads HTTP_PROXY: use a sanctioned client that sets .no_proxy() (see clippy.toml)" },
]
